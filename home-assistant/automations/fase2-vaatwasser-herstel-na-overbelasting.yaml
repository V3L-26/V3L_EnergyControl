# Automatisering "Fase 2 herstellen na overbelasting"
#
# HERSTELD (21 oktober 2026) UIT JE HOME ASSISTANT-BACKUP: de vorige
# "documentatiekopie" miste de command_webview + TTS-telefoonmelding en
# had een andere berichttekst. Alleen de sensor is hier aangepast:
# sensor.p1_meter_vermogen_fase_2 -> sensor.fase_bewaking_l2.
#
# Hoort bij fase2-vaatwasser-afschakelen-bij-overbelasting.yaml.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Fase 2 herstellen na overbelasting
description: ''
triggers:
  - trigger: numeric_state
    entity_id: sensor.fase_bewaking_l2
    below: 4000
    for:
      minutes: 5
conditions:
  - condition: state
    entity_id: input_boolean.vaatwasser_uit_door_overbelasting
    state: 'on'
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.keuken_vaatwasser
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vaatwasser_uit_door_overbelasting
  - sequence:
      - action: notify.send_message
        target:
          entity_id: notify.samsung_s23
        data:
          title: Fase 2 hersteld
          message: De eerder afgeschakelde apparaten op fase 2 zijn weer ingeschakeld.
      - action: notify.mobile_app_samsung_s23
        data:
          message: command_webview
          data:
            ttl: 0
            priority: high
      - delay: '00:00:01'
      - action: notify.mobile_app_samsung_s23
        data:
          message: TTS
          title: De eerder afgeschakelde apparaten op fase 2 zijn weer ingeschakeld.
          data:
            ttl: 0
            priority: high
            importance: high
            tts_text: De eerder afgeschakelde apparaten op fase 2 zijn weer ingeschakeld.
            media_stream: alarm_stream_middle
mode: single
