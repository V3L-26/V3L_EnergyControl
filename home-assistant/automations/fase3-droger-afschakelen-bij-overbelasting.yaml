# Automatisering "Fase 3 afschakelen bij overbelasting"
#
# HERSTELD (21 oktober 2026) UIT JE HOME ASSISTANT-BACKUP: de vorige
# "documentatiekopie" miste de script.turn_on-aanroep naar het
# "dupliceren_dupliceren_dupliceren"-script en de volledige
# telefoonmelding (command_webview + TTS). Alleen de sensor is hier
# aangepast: sensor.p1_meter_vermogen_fase_3 -> sensor.fase_bewaking_l3.
#
# Op fase 3 heeft alleen de Droger een HomeWizard-stekker, dus geen
# cascade nodig zoals bij fase 1 - gewoon uitschakelen bij overschrijding
# van de drempel. Dit staat los van de airco-overbelastingsautomatiseringen
# op fase 3 (woonkamer/Christian/Jason), die onafhankelijk op dezelfde
# sensor reageren.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Fase 3 afschakelen bij overbelasting
description: ''
triggers:
  - trigger: power.changed
    target:
      entity_id: sensor.fase_bewaking_l3
    options:
      threshold:
        type: above
        value:
          active_choice: entity
          number: 4000
          unit_of_measurement: W
          entity: input_number.p1_overload_w
conditions:
  - condition: state
    entity_id: switch.hal_droger
    state: 'on'
actions:
  - delay: '00:00:05'
  - condition: template
    value_template: >-
      {{ states('sensor.fase_bewaking_l3') | float(0) >
      (states('input_number.p1_overload_w') | float(5000)) }}
  - variables:
      overload_watt: "{{ states('sensor.fase_bewaking_l3') | float(0) }}"
      overload_threshold: "{{ states('input_number.p1_overload_w') | float(5000) }}"
  - action: switch.turn_off
    target:
      entity_id: switch.hal_droger
  - action: script.turn_on
    metadata: {}
    target:
      entity_id: >-
        script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_dupliceren_dupliceren
    data: {}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.droger_uit_door_overbelasting
  - sequence:
      - action: notify.send_message
        target:
          entity_id: notify.samsung_s23
        data:
          title: Fase 3 beveiligd
          message: >-
            Eén of meer apparaten op fase 3 zijn automatisch uitgeschakeld
            vanwege dreigende overbelasting.
      - action: notify.mobile_app_samsung_s23
        data:
          message: command_webview
          data:
            ttl: 0
            priority: high
      - delay: '00:00:01'
      - action: notify.mobile_app_samsung_s23
        data:
          message: TTS
          title: >-
            Eén of meer apparaten op fase 3 zijn automatisch uitgeschakeld
            vanwege dreigende overbelasting.
          data:
            ttl: 0
            priority: high
            importance: high
            tts_text: >-
              Eén of meer apparaten op fase 3 zijn automatisch uitgeschakeld
              vanwege dreigende overbelasting. Controleer de Home Assistent
              en Whatsapp meldingen.
            media_stream: alarm_stream_middle
  - action: rest_command.supabase_login
    response_variable: login
  - action: rest_command.supabase_log_overload_event
    data:
      token: "{{ login['content']['access_token'] }}"
      phase: L3
      watt: "{{ overload_watt }}"
      threshold: "{{ overload_threshold }}"
      source: droger
      action: uitgeschakeld
mode: single
