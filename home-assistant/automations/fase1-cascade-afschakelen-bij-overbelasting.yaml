# Automatisering "Fase 1 cascaderend afschakelen bij overbelasting"
#
# HERSTELD (21 oktober 2026) UIT JE HOME ASSISTANT-BACKUP: de versie die
# eerder als "documentatiekopie" in deze repository stond, was een
# incomplete reconstructie - hij miste de script.turn_on-aanroepen naar de
# "dupliceren"-scripts per apparaat en de volledige telefoonmelding
# (command_webview + TTS met gesproken waarschuwing). Die reconstructie is
# (voor zover bekend) nooit in Home Assistant geplakt, dus er is niets
# verloren gegaan - maar plak nu wel ONDERSTAANDE versie, niet een eerdere
# uit deze chat.
#
# Deze versie komt letterlijk uit de automatische Home Assistant-backup
# (homeassistant.tar.gz > automations.yaml), ZONDER verder iets te wijzigen
# behalve: sensor.p1_meter_vermogen_fase_1 -> sensor.fase_bewaking_l1 (de
# nieuwe failover-sensor, zie home-assistant/packages/fase_bewaking_failover.yaml -
# gebruikt de HomeWizard Instant-integratie via WebSocket zolang die
# beschikbaar is, met automatische terugval op de officiele sensor).
#
# Werking (uit de echte backup): bij dreigende overbelasting op fase 1
# worden de daar aangesloten stopcontact-apparaten stap voor stap
# uitgeschakeld - Magnetron -> Airfryer -> Koffiezetapparaat -> Wasmachine -
# met na elke stap een hercontrole en 5 sec pauze, en bij elke stap ook een
# "dupliceren"-script (waarschijnlijk een los Whatsapp/notificatiescript)
# en een Supabase-logregel. Aan het einde volgt een telefoonmelding (eerst
# de app naar de voorgrond via command_webview, dan een gesproken TTS-
# waarschuwing).
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Fase 1 cascaderend afschakelen bij overbelasting
description: ''
triggers:
  - trigger: power.changed
    target:
      entity_id: sensor.fase_bewaking_l1
    options:
      threshold:
        type: above
        value:
          active_choice: entity
          number: 4000
          unit_of_measurement: W
          entity: input_number.p1_overload_w
conditions: []
actions:
  - delay: '00:00:05'
  - condition: template
    value_template: >-
      {{ states('sensor.fase_bewaking_l1') | float(0) >
      (states('input_number.p1_overload_w') | float(5000)) }}
  - variables:
      overload_threshold: "{{ states('input_number.p1_overload_w') | float(5000) }}"
  - action: rest_command.supabase_login
    response_variable: login
  - if:
      - condition: state
        entity_id: switch.keuken_magnetron
        state: 'on'
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.keuken_magnetron
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_3
        data: {}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.magnetron_uit_door_overbelasting
      - action: rest_command.supabase_log_overload_event
        data:
          token: "{{ login['content']['access_token'] }}"
          phase: L1
          watt: "{{ states('sensor.fase_bewaking_l1') | float(0) }}"
          threshold: "{{ overload_threshold }}"
          source: magnetron
          action: uitgeschakeld
      - delay: '00:00:05'
  - if:
      - condition: template
        value_template: "{{ states('sensor.fase_bewaking_l1') | float(0) > overload_threshold }}"
      - condition: state
        entity_id: switch.energy_socket
        state: 'on'
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.energy_socket
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_4
        data: {}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.airfryer_uit_door_overbelasting
      - action: rest_command.supabase_log_overload_event
        data:
          token: "{{ login['content']['access_token'] }}"
          phase: L1
          watt: "{{ states('sensor.fase_bewaking_l1') | float(0) }}"
          threshold: "{{ overload_threshold }}"
          source: airfryer
          action: uitgeschakeld
      - delay: '00:00:05'
  - if:
      - condition: template
        value_template: "{{ states('sensor.fase_bewaking_l1') | float(0) > overload_threshold }}"
      - condition: state
        entity_id: switch.keuken_koffiezetapparaat
        state: 'on'
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.keuken_koffiezetapparaat
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_5
        data: {}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.koffiezetapparaat_uit_door_overbelasting
      - action: rest_command.supabase_log_overload_event
        data:
          token: "{{ login['content']['access_token'] }}"
          phase: L1
          watt: "{{ states('sensor.fase_bewaking_l1') | float(0) }}"
          threshold: "{{ overload_threshold }}"
          source: koffiezetapparaat
          action: uitgeschakeld
      - delay: '00:00:05'
  - if:
      - condition: template
        value_template: "{{ states('sensor.fase_bewaking_l1') | float(0) > overload_threshold }}"
      - condition: state
        entity_id: switch.hal_wasmachine
        state: 'on'
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.hal_wasmachine
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_6
        data: {}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wasmachine_uit_door_overbelasting
      - action: rest_command.supabase_log_overload_event
        data:
          token: "{{ login['content']['access_token'] }}"
          phase: L1
          watt: "{{ states('sensor.fase_bewaking_l1') | float(0) }}"
          threshold: "{{ overload_threshold }}"
          source: wasmachine
          action: uitgeschakeld
  - sequence:
      - action: notify.send_message
        target:
          entity_id: notify.samsung_s23
        data:
          title: Fase 1 beveiligd
          message: >-
            Eén of meer apparaten op fase 1 zijn automatisch uitgeschakeld
            vanwege dreigende overbelasting.
      - action: notify.mobile_app_samsung_s23
        data:
          message: command_webview
          data:
            ttl: 0
            priority: high
      - delay: '00:00:01'
      - action: notify.mobile_app_samsung_s23
        data:
          message: TTS
          title: >-
            Eén of meer apparaten op fase 1 zijn automatisch uitgeschakeld
            vanwege dreigende overbelasting.
          data:
            ttl: 0
            priority: high
            importance: high
            tts_text: >-
              Eén of meer apparaten op fase 1 zijn automatisch uitgeschakeld
              vanwege dreigende overbelasting. Controleer de Home Assistent
              en Whatsapp meldingen.
            media_stream: alarm_stream_middle
mode: single
