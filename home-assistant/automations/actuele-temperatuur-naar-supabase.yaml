# Automatisering "Actuele temperatuur naar Supabase sturen"
#
# Sinds app-versie 3.72 heeft de V3L-app een thermostaat-tegel met daarin
# een "Nu"-veld (de actuele woonkamertemperatuur). Dat veld leest
# app_settings.p1_current_temp rechtstreeks uit Supabase (zelfde tabel als
# de gewenste temperatuur, p1_target_temp - zie app/index.html, functie
# fetchAppSettings/renderCurrentTemp), maar tot nu toe stuurde niets die
# waarde ooit naar Supabase, dus bleef "Nu" op "-" staan.
#
# Deze automatisering doet dat: ze leest de Sonoff-temperatuursensor in de
# woonkamer (sensor.woonkamer_temperatuur_meter_temperatuur) en zet de
# waarde in app_settings via de al bestaande rest_command.supabase_set_setting
# (dezelfde die vroeger de tarieven stuurde, zie de vervallen
# prijzen-naar-supabase.yaml) - dit is dus de omgekeerde richting van
# instellingen-uit-supabase.yaml (die haalt júist van Supabase naar HA).
#
# 21 oktober 2026: nieuw, nog niet getest in de praktijk.

alias: Actuele temperatuur naar Supabase sturen
description: Stuurt de Sonoff-woonkamertemperatuur naar app_settings (p1_current_temp), voor het "Nu"-veld in de V3L-app
triggers:
  - trigger: state
    entity_id: sensor.woonkamer_temperatuur_meter_temperatuur
  - trigger: time_pattern
    minutes: "/5"
conditions:
  - condition: template
    value_template: >-
      {{ states('sensor.woonkamer_temperatuur_meter_temperatuur')
         not in ['unknown', 'unavailable', 'none', ''] }}
actions:
  - action: rest_command.supabase_login
    response_variable: login
  - action: rest_command.supabase_set_setting
    data:
      token: "{{ login['content']['access_token'] }}"
      field: p1_current_temp
      value: "{{ '%.1f' | format(states('sensor.woonkamer_temperatuur_meter_temperatuur') | float) }}"
mode: single
