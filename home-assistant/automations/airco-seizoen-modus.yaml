# Automatisering "Airco seizoen modus"
#
# Bestond al voordat dit project begon: zet een airco bij het aanzetten in
# winterstand (verwarmen, swing stop) onder 19 graden buiten (Buienradar),
# anders in zomerstand (koelen, swing aan), altijd met de ventilator op
# "quiet". Als de woonkamer-airco in de winter wordt aangezet, blijft deze
# automatisering daarna actief (repeat) om via de Sonoff-kamersensor te
# schakelen tussen idle (16 graden) en verwarmen ("push") op basis van de
# helper input_text.woonkamertemperatuur - dezelfde "zet 'm hoog, dan weer
# terug"-truc die ook los is uitgewerkt in
# airco-woonkamer-temp-regelen-op-kamersensor.yaml.
#
# LET OP - niet gelijktijdig met airco-woonkamer-temp-regelen-op-
# kamersensor.yaml gebruiken: die andere automatisering doet voor de
# woonkamer-airco in de praktijk hetzelfde (setpoint + ventilator op basis
# van de Sonoff-sensor bijstellen). Beide tegelijk actief laten zou tot
# twee automatiseringen leiden die om en om tegenstrijdige
# climate.set_temperature/set_fan_mode-commando's naar dezelfde airco
# sturen. Zolang deze automatisering ("Airco seizoen modus") actief is,
# hoort airco-woonkamer-temp-regelen-op-kamersensor.yaml dus uitgeschakeld
# te blijven (wat op dit moment ook het geval is).
#
# UPDATE (21 oktober 2026): de repeat-loop hieronder is op twee punten
# aangepast t.o.v. de oorspronkelijke versie:
#
# 1) QUOTA-FIX: elke climate.set_temperature- en climate.set_fan_mode-
#    aanroep wordt nu eerst vergeleken met de huidige stand van de airco,
#    en alleen daadwerkelijk verstuurd als er echt iets wijzigt. In de
#    oorspronkelijke versie belde de loop - die elke 30 seconden doorloopt
#    zolang de woonkamer-airco in de winter aan het verwarmen is -
#    onvoorwaardelijk naar de Daikin Onecta-cloud, dus 2x per minuut /
#    120x per uur, ook als er niets te wijzigen was. Bij een quota van
#    ~200 Onecta-calls/dag was dat quota daardoor al binnen ongeveer 1,5
#    a 2 uur verwarmen volledig verbruikt - wat ook de andere Daikin-
#    automatiseringen kan laten haperen, met name de
#    overbelastingsbeveiliging (fase1/2/3), die zelf ook een geslaagde
#    Onecta-call nodig heeft om een airco bij dreigende overbelasting uit
#    te zetten. Dit is mogelijk ook de verklaring voor de eerdere "uit-
#    commando kwam vaak niet aan"-problemen bij die automatiseringen (zie
#    de UPDATE (14 oktober 2026)-aantekening in bijvoorbeeld
#    airco-jason-uit-bij-overbelasting-fase3.yaml).
#
# 2) TIJDELIJK, totdat de Broadlink RM4c mini IR-blaster er is en de
#    woonkamer-airco voor temperatuur/ventilator via IR i.p.v. de Onecta-
#    cloud wordt aangestuurd: de push-stand is omlaag gezet van 28 naar 24
#    graden, met de ventilator tijdens het pushen op stand "1" (was
#    "quiet", de ventilator werd in de oorspronkelijke versie tijdens het
#    pushen namelijk nooit aangepast) in plaats van "2" - een
#    voorzichtiger tussenstap om te proberen met minder hete luchtstroom
#    toch voldoende warmte te leveren. Nog niet in de praktijk getest; bij
#    eerder handmatig proberen bleek deze airco om de 20 graden bij de
#    Sonoff-sensor te halen soms echt de volle 28 graden nodig te hebben,
#    dus het kan zijn dat 24 graden niet genoeg blijkt. Zo nodig: in de
#    HA-geschiedenis van sensor.woonkamer_temperatuur_meter_temperatuur
#    controleren of de kamer wel op temperatuur komt, en anders
#    push_setpoint hieronder terugzetten naar 28.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Airco seizoen modus
description: >-
  Als een airco wordt aangezet: onder 19 graden buiten (Buienradar)
  winterstand (verwarmen) en swing stop, anders zomerstand (koelen) en
  swing aan. Altijd quiet, alleen voor de airco die is aangezet. Als de
  Woonkamer in de winter aangaat, blijft deze automatisering actief
  (repeat) om via de Sonoff-sensor te schakelen tussen idle (16 graden,
  ventilator quiet) en verwarmen (push, 24 graden, ventilator stand 1 -
  tijdelijk, zie UPDATE in de bestandscommentaar) op basis van de helper
  input_text.woonkamertemperatuur.
triggers:
  - trigger: climate.turned_on
    target:
      device_id:
        - 11d4134dc902d5394e05404c2712853e
        - 16975c6c2948a23cafb485400b1ee91e
        - 340220b09ca9e0da8edefb69c49a78cd
    options:
      behavior: each
      for: '00:00:00'
conditions: []
actions:
  - variables:
      namen:
        climate.daikinap46344_room_temperature: Woonkamer
        climate.daikinap86208_room_temperature: Jason
        climate.daikinap86096_room_temperature: Christian
      naam: >-
        {{ namen.get(trigger.entity_id, state_attr(trigger.entity_id,
        'friendly_name')) }}
      buiten: '{{ state_attr(''weather.buienradar'', ''temperature'') }}'
  - if:
      - condition: numeric_state
        entity_id: weather.buienradar
        attribute: temperature
        below: 19
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.modus_seizoen
        data:
          value: Winter
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          hvac_mode: heat
      - action: climate.set_swing_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          swing_mode: stop
    else:
      - action: input_text.set_value
        target:
          entity_id: input_text.modus_seizoen
        data:
          value: Zomer
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          hvac_mode: cool
      - action: climate.set_swing_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          swing_mode: swing
  - action: climate.set_fan_mode
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      fan_mode: quiet
  - action: notify.mobile_app_samsung_s23
    data:
      title: Airco {{ naam }} aangezet
      message: >-
        {% set seizoen = states('input_text.modus_seizoen') %} De airco {{ naam
        }} is aangezet en staat nu in de {{ 'winterstand (verwarmen)' if seizoen
        == 'Winter' else 'zomerstand (koelen)' }}, ventilator stil, klep {{
        'vast' if seizoen == 'Winter' else 'bewegend' }}. {% if buiten not in
        [none, 'unknown', 'unavailable'] %}Buiten is het {{ buiten }} °C.{%
        endif %}
      data:
        tag: airco_aan_{{ trigger.entity_id }}
  - if:
      - condition: template
        value_template: >-
          {{ trigger.entity_id == 'climate.daikinap46344_room_temperature' and
          states('input_text.modus_seizoen') == 'Winter' }}
    then:
      - repeat:
          sequence:
            - variables:
                push_setpoint: 24.0
                push_fan_mode: '1'
                idle_setpoint: 16.0
                idle_fan_mode: quiet
                desired: "{{ states('input_text.woonkamertemperatuur') | float(21.0) }}"
                room_now: "{{ states('sensor.woonkamer_temperatuur_meter_temperatuur') | float(0) }}"
                daikin_setpoint_now: "{{ state_attr('climate.daikinap46344_room_temperature', 'temperature') | float(none) }}"
                daikin_fan_now: "{{ state_attr('climate.daikinap46344_room_temperature', 'fan_mode') }}"
            - choose:
                # Kamer al warm genoeg (of warmer): terug naar idle (16
                # graden, ventilator quiet) - alleen de commando's sturen
                # die daadwerkelijk nodig zijn.
                - conditions:
                    - condition: template
                      value_template: "{{ room_now >= (desired + 0.5) }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: >-
                            {{ daikin_setpoint_now is none or
                            (daikin_setpoint_now - idle_setpoint) | abs > 0.4 }}
                      then:
                        - action: climate.set_temperature
                          target:
                            entity_id: climate.daikinap46344_room_temperature
                          data:
                            temperature: "{{ idle_setpoint }}"
                    - if:
                        - condition: template
                          value_template: "{{ daikin_fan_now != idle_fan_mode }}"
                      then:
                        - action: climate.set_fan_mode
                          target:
                            entity_id: climate.daikinap46344_room_temperature
                          data:
                            fan_mode: "{{ idle_fan_mode }}"
                # Kamer nog te koud: naar de push-stand (24 graden,
                # ventilator 1) - alleen de commando's sturen die
                # daadwerkelijk nodig zijn.
                - conditions:
                    - condition: template
                      value_template: "{{ room_now < desired }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: >-
                            {{ daikin_setpoint_now is none or
                            (daikin_setpoint_now - push_setpoint) | abs > 0.4 }}
                      then:
                        - action: climate.set_temperature
                          target:
                            entity_id: climate.daikinap46344_room_temperature
                          data:
                            temperature: "{{ push_setpoint }}"
                    - if:
                        - condition: template
                          value_template: "{{ daikin_fan_now != push_fan_mode }}"
                      then:
                        - action: climate.set_fan_mode
                          target:
                            entity_id: climate.daikinap46344_room_temperature
                          data:
                            fan_mode: "{{ push_fan_mode }}"
            - delay:
                seconds: 30
          until:
            - condition: template
              value_template: '{{ is_state(''climate.daikinap46344_room_temperature'', ''off'') }}'
mode: queued
max: 5
