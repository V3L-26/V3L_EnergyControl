# Automatisering "Airco seizoen modus"
#
# Bestond al voordat dit project begon: zet een airco bij het aanzetten in
# winterstand (verwarmen, swing stop) onder 19 graden buiten (Buienradar),
# anders in zomerstand (koelen, swing aan), altijd met de ventilator op
# "quiet". Als de woonkamer-airco in de winter wordt aangezet, blijft deze
# automatisering daarna actief (repeat) om via de Sonoff-kamersensor te
# schakelen tussen idle en verwarmen ("push") op basis van de helper
# input_text.woonkamertemperatuur.
#
# LET OP - niet gelijktijdig met airco-woonkamer-temp-regelen-op-
# kamersensor.yaml gebruiken: die andere automatisering doet voor de
# woonkamer-airco in de praktijk hetzelfde (setpoint + ventilator op basis
# van de Sonoff-sensor bijstellen). Beide tegelijk actief laten zou tot
# twee automatiseringen leiden die om en om tegenstrijdige commando's naar
# dezelfde airco sturen. Zolang deze automatisering ("Airco seizoen modus")
# actief is, hoort airco-woonkamer-temp-regelen-op-kamersensor.yaml dus
# uitgeschakeld te blijven (wat op dit moment ook het geval is).
#
# UPDATE (21 oktober 2026): de repeat-loop stuurde oorspronkelijk
# onvoorwaardelijk elke 30 seconden climate.set_temperature/set_fan_mode
# naar de Daikin Onecta-cloud, ook als er niets te wijzigen was - bij een
# quota van ~200 Onecta-calls/dag was dat quota daardoor al binnen
# ongeveer 1,5 a 2 uur verwarmen volledig verbruikt, wat ook de
# overbelastingsbeveiliging kon laten haperen (die zelf ook een geslaagde
# Onecta-call nodig had om een airco bij dreigende overbelasting uit te
# zetten). Als tijdelijke oplossing, in afwachting van de Broadlink RM4c
# mini IR-blaster, is toen eerst de push-temperatuur omlaag gezet (28 naar
# 24 graden) en zijn er guard-condities toegevoegd om alleen daadwerkelijk
# wijzigende commando's te versturen.
#
# UPDATE (22 oktober 2026): de Broadlink RM4c mini IR-blaster is er, en de
# woonkamer-airco wordt voor verwarmen nu via IR aangestuurd met twee
# losse scripts in plaats van rechtstreekse climate.set_temperature/
# set_fan_mode-aanroepen naar de Onecta-cloud - dat maakt zowel de
# quota-zorg hierboven als de guard-condities en de vaste push/idle-
# setpoints (24/16 graden) overbodig; die logica zit nu in de scripts
# zelf. De repeat-loop roept nu simpelweg een van de twee scripts aan, met
# 1 graad hysterese om niet rond de grens te blijven schakelen:
#   - sensor.woonkamer_temperatuur_meter_temperatuur >= gewenste
#     temperatuur (input_text.woonkamertemperatuur) ->
#     script.airco_idle_verwarmen_vast_naar_18_econo_quiet
#   - sensor.woonkamer_temperatuur_meter_temperatuur <= gewenste
#     temperatuur min 1 graad -> script.airco_aan_verwarmen_1_econo_quiet
#   - daartussenin: geen actie, laatst gekozen stand blijft staan
# Nog niet getest in de praktijk (stand: 22 oktober 2026) - bij een
# eerstvolgende verwarmbeurt in de gaten houden of de kamer goed op
# temperatuur komt en blijft, en of de scripts niet onnodig vaak opnieuw
# worden aangeroepen terwijl de stand al goed staat (dat stuurt nu elke 30
# seconden hetzelfde IR-commando opnieuw zolang de kamer binnen dezelfde
# idle- of push-toestand blijft - zie je daar ongewenste neveneffecten van
# bij de airco zelf, zoals een piepje per IR-commando, dan kunnen we een
# guard toevoegen zodat een script alleen wordt aangeroepen bij een
# daadwerkelijke overgang).
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Airco seizoen modus
description: >-
  Als een airco wordt aangezet: onder 19 graden buiten (Buienradar)
  winterstand (verwarmen) en swing stop, anders zomerstand (koelen) en
  swing aan. Altijd quiet, alleen voor de airco die is aangezet. Als de
  Woonkamer in de winter aangaat, blijft deze automatisering actief
  (repeat) om via IR-scripts te schakelen tussen idle en verwarmen op
  basis van de helper input_text.woonkamertemperatuur en de Sonoff-
  kamersensor.
triggers:
  - trigger: climate.turned_on
    target:
      device_id:
        - 11d4134dc902d5394e05404c2712853e
        - 16975c6c2948a23cafb485400b1ee91e
        - 340220b09ca9e0da8edefb69c49a78cd
    options:
      behavior: each
      for: '00:00:00'
conditions: []
actions:
  - variables:
      namen:
        climate.daikinap46344_room_temperature: Woonkamer
        climate.daikinap86208_room_temperature: Jason
        climate.daikinap86096_room_temperature: Christian
      naam: >-
        {{ namen.get(trigger.entity_id, state_attr(trigger.entity_id,
        'friendly_name')) }}
      buiten: '{{ state_attr(''weather.buienradar'', ''temperature'') }}'
  - if:
      - condition: numeric_state
        entity_id: weather.buienradar
        attribute: temperature
        below: 19
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.modus_seizoen
        data:
          value: Winter
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          hvac_mode: heat
      - action: climate.set_swing_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          swing_mode: stop
    else:
      - action: input_text.set_value
        target:
          entity_id: input_text.modus_seizoen
        data:
          value: Zomer
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          hvac_mode: cool
      - action: climate.set_swing_mode
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          swing_mode: swing
  - action: climate.set_fan_mode
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      fan_mode: quiet
  - action: notify.mobile_app_samsung_s23
    data:
      title: Airco {{ naam }} aangezet
      message: >-
        {% set seizoen = states('input_text.modus_seizoen') %} De airco {{ naam
        }} is aangezet en staat nu in de {{ 'winterstand (verwarmen)' if seizoen
        == 'Winter' else 'zomerstand (koelen)' }}, ventilator stil, klep {{
        'vast' if seizoen == 'Winter' else 'bewegend' }}. {% if buiten not in
        [none, 'unknown', 'unavailable'] %}Buiten is het {{ buiten }} °C.{%
        endif %}
      data:
        tag: airco_aan_{{ trigger.entity_id }}
  - if:
      - condition: template
        value_template: >-
          {{ trigger.entity_id == 'climate.daikinap46344_room_temperature' and
          states('input_text.modus_seizoen') == 'Winter' }}
    then:
      - repeat:
          sequence:
            - variables:
                desired: "{{ states('input_text.woonkamertemperatuur') | float(21.0) }}"
                room_now: >-
                  {{ states('sensor.woonkamer_temperatuur_meter_temperatuur') |
                  float(0) }}
            - choose:
                # Gewenste temperatuur bereikt (of hoger): idle-script.
                - conditions:
                    - condition: template
                      value_template: '{{ room_now >= desired }}'
                  sequence:
                    - action: script.turn_on
                      target:
                        entity_id: script.airco_idle_verwarmen_vast_naar_18_econo_quiet
                # 1 graad onder de gewenste temperatuur gezakt: aan/push-script.
                - conditions:
                    - condition: template
                      value_template: '{{ room_now <= (desired - 1) }}'
                  sequence:
                    - action: script.turn_on
                      target:
                        entity_id: script.airco_aan_verwarmen_1_econo_quiet
                # Daartussenin (desired - 1 tot desired): geen actie, laatst
                # gekozen stand blijft staan (1 graad hysterese).
            - delay:
                seconds: 30
          until:
            - condition: template
              value_template: '{{ is_state(''climate.daikinap46344_room_temperature'', ''off'') }}'
mode: queued
max: 5
