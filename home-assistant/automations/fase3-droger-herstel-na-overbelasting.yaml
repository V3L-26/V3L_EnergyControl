# Automatisering "Fase 3 herstellen na overbelasting"
#
# HERSTELD (21 oktober 2026) UIT JE HOME ASSISTANT-BACKUP: de vorige
# "documentatiekopie" miste de command_webview + TTS-telefoonmelding en
# had een andere berichttekst. Alleen de sensor is hier aangepast:
# sensor.p1_meter_vermogen_fase_3 -> sensor.fase_bewaking_l3.
#
# Hoort bij fase3-droger-afschakelen-bij-overbelasting.yaml.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Fase 3 herstellen na overbelasting
description: ''
triggers:
  - trigger: numeric_state
    entity_id: sensor.fase_bewaking_l3
    below: 4000
    for:
      minutes: 5
conditions:
  - condition: state
    entity_id: input_boolean.droger_uit_door_overbelasting
    state: 'on'
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.hal_droger
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.droger_uit_door_overbelasting
  - sequence:
      - action: notify.send_message
        target:
          entity_id: notify.samsung_s23
        data:
          title: Fase 3 hersteld
          message: De eerder afgeschakelde apparaten op fase 3 zijn weer ingeschakeld.
      - action: notify.mobile_app_samsung_s23
        data:
          message: command_webview
          data:
            ttl: 0
            priority: high
      - delay: '00:00:01'
      - action: notify.mobile_app_samsung_s23
        data:
          message: TTS
          title: De eerder afgeschakelde apparaten op fase 3 zijn weer ingeschakeld.
          data:
            ttl: 0
            priority: high
            importance: high
            tts_text: De eerder afgeschakelde apparaten op fase 3 zijn weer ingeschakeld.
            media_stream: alarm_stream_middle
mode: single
