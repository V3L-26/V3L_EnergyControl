# Automatisering "Fase 3 herstellen na overbelasting"
#
# Hoort bij fase3-droger-afschakelen-bij-overbelasting.yaml. Automatisch
# herstel zodra fase 3 vijf minuten onder 4000 W blijft - net als de
# andere nieuwe HomeWizard-stekker-automatiseringen, en in tegenstelling
# tot de airco's (waar herstel handmatig is vanwege de onbetrouwbare
# Daikin-cloud).
#
# Nog niet getest in de praktijk (stand: 27 september 2026).
#
#
# UPDATE (21 oktober 2026): fase 1/2/3 worden hier niet meer rechtstreeks
# via sensor.p1_meter_vermogen_fase_N gevolgd, maar via de nieuwe
# failover-sensoren sensor.fase_bewaking_l1/l2/l3 (zie het pakket
# home-assistant/packages/fase-bewaking-failover.yaml). Die sensoren
# gebruiken de HomeWizard Instant-integratie (WebSocket, sub-seconde
# updates van de P1-meter zelf i.p.v. de ~5 sec polling van de officiele
# integratie) als die beschikbaar is, en vallen automatisch terug op de
# officiele HomeWizard Energy-sensor zodra de WebSocket-verbinding van
# die integratie wegvalt. Deze automatisering zelf hoeft daar niets voor
# te doen - ze leest gewoon de failover-sensor, die zich naar buiten toe
# identiek gedraagt als de oude sensor (zelfde eenheid, zelfde type
# waarden). Nog niet getest in de praktijk (stand: 21 oktober 2026).
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Fase 3 herstellen na overbelasting
description: ''
triggers:
  - trigger: numeric_state
    entity_id: sensor.fase_bewaking_l3
    below: 4000
    for:
      minutes: 5
conditions:
  - condition: state
    entity_id: input_boolean.droger_uit_door_overbelasting
    state: 'on'
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.hal_droger
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.droger_uit_door_overbelasting
  - action: notify.send_message
    target:
      entity_id: notify.samsung_s23
    data:
      title: Fase 3 hersteld
      message: De droger is weer ingeschakeld.
mode: single
