# Automatisering "Airco woonkamer - kamersensor regelen (setpoint-nudge)"
#
# Vervangt het handmatige trucje "zet de Daikin op 28 graden zodat hij niet
# te vroeg gaat idlen op zijn eigen (te koude) interne sensor". In plaats
# van in één keer naar een ver setpoint te springen (waardoor de unit vol
# vermogen geeft en de luchtstroom vlak bij de unit erg warm wordt), zet
# deze automatisering de Daikin-setpoint telkens maar een klein stukje
# (STEP) boven wat de Daikin ZELF intern meet. Zo denkt de unit nooit dat
# hij al (bijna) klaar is en blijft hij doorverwarmen, maar hoeft hij nooit
# een groot gat in één keer te overbruggen - dus geen volle-hitte-uitstoot.
# Zodra de ECHTE kamertemperatuur (de Sonoff-sensor) de gewenste waarde
# bereikt, wordt de setpoint teruggezet naar de gewenste temperatuur zelf,
# zodat de unit rustig kan uitregelen/idlen.
#
# Deze automatisering regelt ALLEEN de doeltemperatuur (climate.set_temperature
# met enkel het veld "temperature"). Ventilatorstand (stille ventilator) en
# modus (eco) worden niet aangeraakt en blijven dus precies zoals ingesteld.
#
# BELANGRIJK - Daikin Onecta cloud quota: de Onecta-integratie heeft een
# quota van ~200 API-calls per dag (zie ook de overbelastings-automatiseringen
# die hier al rekening mee houden). Deze automatisering checkt elke 5
# minuten of er genudged moet worden, maar stuurt ALLEEN daadwerkelijk een
# commando naar de Daikin als de nieuwe setpoint merkbaar afwijkt van de
# huidige (zie de conditie "alleen bij verschil" in de acties) - dus niet
# elke 5 minuten een call, alleen als het echt nodig is. Loopt dit toch
# tegen de quota aan (bijvoorbeeld bij lange verwarmsessies of als je dit
# straks ook voor de andere twee airco's bouwt), overweeg dan het interval
# hieronder (momenteel "/5", elke 5 minuten) te verruimen naar bijvoorbeeld
# elke 10 minuten.
#
# Alleen actief zolang de airco zelf al in modus "heat" staat (deze
# automatisering zet de airco niet zelf aan of uit - dat doe je zelf of via
# een andere automatisering).
#
# Nieuw, 21 oktober 2026 - nog niet getest in de praktijk.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Airco woonkamer - kamersensor regelen (setpoint-nudge)
description: >-
  Houdt de Daikin-setpoint dicht bij zijn eigen interne meting (in kleine
  stapjes omhoog) totdat de Sonoff-kamersensor de gewenste temperatuur
  bereikt, om het "zet 'm maar op 28" trucje en de hete luchtstroom erbij
  te vermijden.
triggers:
  - trigger: time_pattern
    minutes: "/5"
  - trigger: state
    entity_id: sensor.woonkamer_temperatuur_meter_temperatuur
conditions:
  - condition: state
    entity_id: climate.daikinap46344_room_temperature
    state: 'heat'
actions:
  - variables:
      step: 1.0
      max_setpoint: 23.0
      deadband: 0.3
      desired: "{{ states('input_text.woonkamertemperatuur') | float(20) }}"
      room_now: "{{ states('sensor.woonkamer_temperatuur_meter_temperatuur') | float(none) }}"
      daikin_internal: "{{ state_attr('climate.daikinap46344_room_temperature', 'current_temperature') | float(none) }}"
      daikin_setpoint_now: "{{ state_attr('climate.daikinap46344_room_temperature', 'temperature') | float(none) }}"
  - condition: template
    value_template: "{{ room_now is not none and daikin_internal is not none and daikin_setpoint_now is not none }}"
  - choose:
      # Kamer nog te koud: zet de setpoint een klein stukje boven wat de
      # Daikin zelf meet, zodat hij blijft doorverwarmen zonder meteen vol
      # vermogen te geven - maar alleen als dat een merkbaar andere
      # setpoint oplevert dan nu al ingesteld staat (quota-vriendelijk).
      - conditions:
          - condition: template
            value_template: "{{ room_now < (desired - deadband) }}"
        sequence:
          - variables:
              new_setpoint: "{{ [daikin_internal + step, max_setpoint] | min }}"
          - condition: template
            value_template: "{{ (new_setpoint - daikin_setpoint_now) | abs > 0.4 }}"
          - action: climate.set_temperature
            target:
              entity_id: climate.daikinap46344_room_temperature
            data:
              temperature: "{{ new_setpoint }}"
      # Kamer heeft de gewenste temperatuur bereikt: zet de setpoint terug
      # naar de gewenste waarde zelf, zodat de Daikin rustig kan uitregelen
      # in plaats van op een kunstmatig hoge setpoint te blijven staan.
      - conditions:
          - condition: template
            value_template: "{{ room_now >= (desired - deadband) }}"
        sequence:
          - condition: template
            value_template: "{{ (daikin_setpoint_now - desired) | abs > 0.4 }}"
          - action: climate.set_temperature
            target:
              entity_id: climate.daikinap46344_room_temperature
            data:
              temperature: "{{ desired }}"
mode: single
