# Automatisering "P1-meter naar Supabase pushen"
#
# Bestond al voordat dit project begon: pusht doorlopend de live P1-
# meterstand naar latest_status (rest_command.push_p1_naar_supabase).
#
# UPDATE (21 oktober 2026): de trigger hieronder is bijgewerkt om op de
# nieuwe failover-sensor sensor.fase_bewaking_totaal te reageren (zie
# home-assistant/packages/fase_bewaking_failover.yaml) in plaats van
# rechtstreeks op sensor.p1_meter_vermogen.
#
# BEVESTIGD (21 oktober 2026, later) uit Arjans eigen Home Assistant-
# backup: de oorspronkelijke trigger was inderdaad precies een kale
# state-trigger op sensor.p1_meter_vermogen, zonder verdere opties -
# exact zoals eerder (op basis van de beschrijving) gereconstrueerd. Geen
# wijziging nodig t.o.v. de vorige versie van dit bestand.
#
# Zodra de HomeWizard Instant-integratie gekoppeld is (zie het pakket
# hierboven), wijzigt sensor.fase_bewaking_totaal realtime mee met de
# WebSocket-updates van de P1-meter (meestal elke 1-10 sec) in plaats van
# de ~5 sec polling van de officiele integratie - deze automatisering
# vuurt daardoor net zo vaak, en de live weergave in de V3L-app wordt dus
# mee versneld.
#
# actions (bevestigd, ongewijzigd):
#   - action: rest_command.push_p1_naar_supabase
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: P1-meter naar Supabase pushen
description: Pusht de live P1-meterstand doorlopend naar latest_status
triggers:
  - trigger: state
    entity_id: sensor.fase_bewaking_totaal
conditions: []
actions:
  - action: rest_command.push_p1_naar_supabase
mode: single
