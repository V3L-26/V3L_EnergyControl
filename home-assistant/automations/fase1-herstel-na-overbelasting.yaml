# Automatisering "Fase 1 herstellen na overbelasting"
#
# HERSTELD (21 oktober 2026) UIT JE HOME ASSISTANT-BACKUP: de vorige
# "documentatiekopie" miste de command_webview + TTS-telefoonmelding die
# je echte automatisering wel stuurt na herstel. Alleen de sensor is hier
# aangepast: sensor.p1_meter_vermogen_fase_1 -> sensor.fase_bewaking_l1.
#
# Hoort bij fase1-cascade-afschakelen-bij-overbelasting.yaml. Zodra fase 1
# vijf minuten onder 4000 W blijft, worden de apparaten die door die
# automatisering zijn uitgeschakeld (bijgehouden via input_boolean-
# helpers) weer ingeschakeld.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Fase 1 herstellen na overbelasting
description: ''
triggers:
  - trigger: numeric_state
    entity_id: sensor.fase_bewaking_l1
    below: 4000
    for:
      minutes: 5
conditions:
  - condition: or
    conditions:
      - condition: state
        entity_id: input_boolean.magnetron_uit_door_overbelasting
        state: 'on'
      - condition: state
        entity_id: input_boolean.airfryer_uit_door_overbelasting
        state: 'on'
      - condition: state
        entity_id: input_boolean.koffiezetapparaat_uit_door_overbelasting
        state: 'on'
      - condition: state
        entity_id: input_boolean.wasmachine_uit_door_overbelasting
        state: 'on'
actions:
  - if:
      - condition: state
        entity_id: input_boolean.magnetron_uit_door_overbelasting
        state: 'on'
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.keuken_magnetron
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.magnetron_uit_door_overbelasting
  - if:
      - condition: state
        entity_id: input_boolean.airfryer_uit_door_overbelasting
        state: 'on'
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.energy_socket
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airfryer_uit_door_overbelasting
  - if:
      - condition: state
        entity_id: input_boolean.koffiezetapparaat_uit_door_overbelasting
        state: 'on'
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.keuken_koffiezetapparaat
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.koffiezetapparaat_uit_door_overbelasting
  - if:
      - condition: state
        entity_id: input_boolean.wasmachine_uit_door_overbelasting
        state: 'on'
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.hal_wasmachine
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wasmachine_uit_door_overbelasting
  - sequence:
      - action: notify.send_message
        target:
          entity_id: notify.samsung_s23
        data:
          title: Fase 1 hersteld
          message: De eerder afgeschakelde apparaten op fase 1 zijn weer ingeschakeld.
      - action: notify.mobile_app_samsung_s23
        data:
          message: command_webview
          data:
            ttl: 0
            priority: high
      - delay: '00:00:01'
      - action: notify.mobile_app_samsung_s23
        data:
          message: TTS
          title: De eerder afgeschakelde apparaten op fase 1 zijn weer ingeschakeld.
          data:
            ttl: 0
            priority: high
            importance: high
            tts_text: De eerder afgeschakelde apparaten op fase 1 zijn weer ingeschakeld.
            media_stream: alarm_stream_middle
mode: single
