# Automatisering "Airco woonkamer uitzetten bij overbelasting"
#
# HERSTELD (21 oktober 2026) UIT JE HOME ASSISTANT-BACKUP - BELANGRIJKE
# CORRECTIE: de documentatie in deze repository beschreef een "UPDATE (14
# oktober 2026)" die de refresh+wait_template-aanpak zou hebben vervangen
# door drie keer achter elkaar een uit-commando te sturen (zonder refresh,
# zonder TTS-melding, zonder cascade naar een ander script). Je backup van
# vandaag laat zien dat die vervanging NOOIT daadwerkelijk in je Home
# Assistant is doorgevoerd: de echte, live automatisering gebruikt nog
# steeds de oorspronkelijke aanpak - refresh-knop + wachten op een verse
# status (max 30 sec), dan het uit-commando, gevolgd door een
# telefoonmelding (command_webview + TTS "Let op! De airco in de
# woonkamer...") en een aanroep van het script
# script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_2.
# Die beschrijving in de documentatie was dus feitelijk onjuist - dit
# bestand herstelt de documentatie naar wat er echt staat.
#
# Onderstaande versie is letterlijk uit de automatische Home Assistant-
# backup (homeassistant.tar.gz > automations.yaml), ZONDER verder iets te
# wijzigen behalve: sensor.p1_meter_vermogen_fase_3 -> sensor.fase_bewaking_l3
# (de nieuwe failover-sensor, zie
# home-assistant/packages/fase_bewaking_failover.yaml).
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Airco woonkamer uitzetten bij overbelasting
description: ''
triggers:
  - trigger: power.changed
    target:
      entity_id: sensor.fase_bewaking_l3
    options:
      threshold:
        type: above
        value:
          active_choice: entity
          number: 4000
          unit_of_measurement: W
          entity: input_number.p1_overload_w
conditions: []
actions:
  - delay: '00:00:05'
  - condition: template
    value_template: >-
      {{ states('sensor.fase_bewaking_l3') | float(0) >
      (states('input_number.p1_overload_w') | float(5000)) }}
  - variables:
      voor_refresh: states.climate.daikinap46344_room_temperature.last_updated
      overload_watt: "{{ states('sensor.fase_bewaking_l3') | float(0) }}"
      overload_threshold: "{{ states('input_number.p1_overload_w') | float(5000) }}"
  - action: button.press
    target:
      entity_id: button.daikinap46344_refresh
    data: {}
  - wait_template: >-
      {{ states.climate.daikinap46344_room_temperature.last_updated !=
      voor_refresh }}
    timeout:
      seconds: 30
    continue_on_timeout: true
  - action: climate.set_hvac_mode
    target:
      device_id: 11d4134dc902d5394e05404c2712853e
    data:
      hvac_mode: 'off'
    alias: Airco uitschakelen
  - sequence:
      - action: notify.mobile_app_samsung_s23
        data:
          message: command_webview
          data:
            ttl: 0
            priority: high
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - action: notify.mobile_app_samsung_s23
        data:
          message: TTS
          title: Airco woonkamer uitgeschakeld
          data:
            ttl: 0
            priority: high
            importance: high
            tts_text: >-
              Let op! De airco in de woonkamer is zojuist uitgeschakeld
              wegens dreigende overbelasting van fase 3.
            media_stream: alarm_stream_middle
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.airco_unit_christian_uit_dreigende_overbelasting_dupliceren_2
        data: {}
  - action: rest_command.supabase_login
    response_variable: login
  - action: rest_command.supabase_log_overload_event
    data:
      token: "{{ login['content']['access_token'] }}"
      phase: L3
      watt: "{{ overload_watt }}"
      threshold: "{{ overload_threshold }}"
      source: airco_woonkamer
      action: uitgeschakeld
mode: single
