# Pakket "Fase bewaking failover" (nieuw, 21 oktober 2026)
#
# Drie template-sensoren die de drie fase-vermogens voor de
# overbelastingsbeveiliging ("fase bewaking") leveren:
# sensor.fase_bewaking_l1 / l2 / l3. Al deze overbelastings-automatiseringen
# (fase1-cascade-*, fase2-vaatwasser-*, fase3-droger-*, airco-*-fase3,
# overbelasting-melding) lezen voortaan deze drie sensoren in plaats van
# rechtstreeks sensor.p1_meter_vermogen_fase_N.
#
# WAAROM: de officiele HomeWizard Energy-integratie pollt de P1-meter maar
# ~5 seconden. De HomeWizard Instant-integratie (community, via HACS -
# https://github.com/hprax/homeassistant-homewizard-instant) ontvangt
# dezelfde data realtime via een WebSocket, dus net zo snel als de P1-poort
# zelf update (meestal elke 1-10 seconden, afhankelijk van het meter-
# model). Voor een beveiliging die juist bedoeld is om snel in te grijpen
# bij een dreigende overbelasting is dat de moeite waard.
#
# Elke sensor hieronder gebruikt de Instant-sensor zolang die een geldige
# waarde heeft, en valt automatisch terug op de officiele sensor zodra de
# Instant-sensor 'unavailable'/'unknown' wordt (bijvoorbeeld omdat de
# WebSocket-verbinding is weggevallen - de Instant-integratie herverbindt
# dat vanzelf na 5 seconden, maar in de tussentijd blijft fase bewaking
# dankzij deze fallback gewoon doorwerken op de officiele, iets tragere
# sensor in plaats van helemaal stil te vallen). Het "bron"-attribuut per
# sensor laat zien welke van de twee op dit moment actief is - handig om
# in Developer Tools > States te controleren of de Instant-integratie
# daadwerkelijk wordt gebruikt.
#
# BELANGRIJK - NOG IN TE VULLEN: de drie "sensor.VUL_IN_..." entity_id's
# hieronder zijn een aanname (gebaseerd op de broncode van de Instant-
# integratie, niet bevestigd). Zodra de HomeWizard Instant-integratie is
# geinstalleerd en gekoppeld (zie stappen in de chat), ga je naar
# Instellingen > Apparaten en diensten > Entiteiten, zoek op "active
# power" of de naam van je nieuwe apparaat, en vervang de drie
# "sensor.VUL_IN_..." hieronder door de echte entity_id's. Zolang dat niet
# is gebeurd, faalt de "if"-conditie hieronder gewoon altijd (een
# niet-bestaande entiteit levert 'unknown' op) en blijft alles stil
# werken op de officiele sensor - dus niets breekt, de beveiliging werkt
# gewoon nog niet sneller dan voorheen totdat dit is ingevuld.
#
# Documentatiekopie - het echte pakket staat in Home Assistant zelf,
# in /config/packages/fase-bewaking-failover.yaml (zie
# homeassistant: packages: !include_dir_named packages in configuration.yaml).

template:
  - sensor:
      - name: "Fase bewaking L1"
        unique_id: fase_bewaking_l1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set instant = states('sensor.VUL_IN_instant_vermogen_fase_1') %}
          {% if instant not in ['unknown', 'unavailable', 'none', ''] %}
            {{ instant }}
          {% else %}
            {{ states('sensor.p1_meter_vermogen_fase_1') }}
          {% endif %}
        attributes:
          bron: >-
            {% set instant = states('sensor.VUL_IN_instant_vermogen_fase_1') %}
            {{ 'instant (websocket)' if instant not in ['unknown', 'unavailable', 'none', ''] else 'officieel (fallback)' }}

      - name: "Fase bewaking L2"
        unique_id: fase_bewaking_l2
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set instant = states('sensor.VUL_IN_instant_vermogen_fase_2') %}
          {% if instant not in ['unknown', 'unavailable', 'none', ''] %}
            {{ instant }}
          {% else %}
            {{ states('sensor.p1_meter_vermogen_fase_2') }}
          {% endif %}
        attributes:
          bron: >-
            {% set instant = states('sensor.VUL_IN_instant_vermogen_fase_2') %}
            {{ 'instant (websocket)' if instant not in ['unknown', 'unavailable', 'none', ''] else 'officieel (fallback)' }}

      - name: "Fase bewaking L3"
        unique_id: fase_bewaking_l3
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set instant = states('sensor.VUL_IN_instant_vermogen_fase_3') %}
          {% if instant not in ['unknown', 'unavailable', 'none', ''] %}
            {{ instant }}
          {% else %}
            {{ states('sensor.p1_meter_vermogen_fase_3') }}
          {% endif %}
        attributes:
          bron: >-
            {% set instant = states('sensor.VUL_IN_instant_vermogen_fase_3') %}
            {{ 'instant (websocket)' if instant not in ['unknown', 'unavailable', 'none', ''] else 'officieel (fallback)' }}
